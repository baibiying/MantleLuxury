server:
  port: 8080

spring:
  application:
    name: mantle-luxury-backend

  datasource:
    url: jdbc:mysql://localhost:3306/mantle_luxury?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 改为 validate，避免 Hibernate 自动修改表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 区块链配置
blockchain:
  enabled: true  # 设置为 true 启用真实的区块链部署到 Mantle 测试网
  # Mantle Sepolia 测试网 RPC URL（已验证可用）
  rpc-url: https://rpc.sepolia.mantle.xyz
  private-key: 773d526fabccd1b26abef51ed7bdcda523409069ecfecd4269cb757c282a599e # 从环境变量读取私钥，或直接配置（不要提交到 Git）
  yield-distribution-contract: "0x988304593FC2e89e56FFAD9393Af0B97c37d9E5D"  # YieldDistribution 合约地址
  kyc-registry-contract: "0x519AD3F043581620e67567c896508b8Da33fF91D"  # KYCRegistry 合约地址（最新部署）
  custody-manager-contract: "0xF1c527a19b65E3e9Ab9AD7499cc8167C63c3ca87"  # CustodyManager 合约地址

# 管理员配置
admin:
  # 管理员钱包地址列表（小写，用逗号分隔）
  # 这些地址可以访问管理后台功能
  wallet-addresses: "0x70a0af9d47a0f6314c4eef2a68666b096701ebdf"


