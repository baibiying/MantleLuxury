server:
  port: ${PORT:8080}

spring:
  application:
    name: mantle-luxury-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/mantle_luxury?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&autoReconnect=true&tcpKeepAlive=true&tcpNoDelay=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: update  # 临时改为 update，让 Hibernate 自动创建 asset_images 表（创建后建议改回 validate）
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 处理 MySQL 表名大小写问题（Linux 系统上 MySQL 区分大小写）
        # 使用标准命名策略，不转换表名和列名
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  mail:
    host: ${MAIL_HOST:smtp.mail.me.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:baibiying@icloud.com}  # SMTP 认证账户（实际发送账户）
    password: ${MAIL_PASSWORD:crqq-nqbc-iuev-asgh}  # iCloud 应用专用密码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@mantleluxury.com}  # 显示的发件人地址
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info

# CORS 配置
# 支持多个源，用逗号分隔
# 本地开发：http://localhost:3000
# 生产环境：通过环境变量 CORS_ALLOWED_ORIGINS 配置（例如：https://ml-snowy-five.vercel.app,http://localhost:3000）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 区块链配置
blockchain:
  enabled: ${BLOCKCHAIN_ENABLED:true}  # 设置为 true 启用真实的区块链部署到 Mantle 测试网
  # Mantle Sepolia 测试网 RPC URL（已验证可用）
  rpc-url: ${BLOCKCHAIN_RPC_URL:https://rpc.sepolia.mantle.xyz}
  private-key: ${BLOCKCHAIN_PRIVATE_KEY:773d526fabccd1b26abef51ed7bdcda523409069ecfecd4269cb757c282a599e} # 从环境变量读取私钥，或直接配置（不要提交到 Git）
  chain-id: ${BLOCKCHAIN_CHAIN_ID:5003}  # Mantle Sepolia Chain ID
  gas-limit: ${BLOCKCHAIN_GAS_LIMIT:80000000}  # Gas 限制（默认 80000000，足够大部分操作）
  yield-distribution-contract: ${YIELD_DISTRIBUTION_CONTRACT:0x988304593FC2e89e56FFAD9393Af0B97c37d9E5D}  # YieldDistribution 合约地址
  kyc-registry-contract: ${KYC_REGISTRY_CONTRACT:0x519AD3F043581620e67567c896508b8Da33fF91D}  # KYCRegistry 合约地址（最新部署）
  custody-manager-contract: ${CUSTODY_MANAGER_CONTRACT:0xF1c527a19b65E3e9Ab9AD7499cc8167C63c3ca87}  # CustodyManager 合约地址

# 管理员配置
admin:
  # 管理员钱包地址列表（小写，用逗号分隔）
  # 这些地址可以访问管理后台功能
  wallet-addresses: ${ADMIN_WALLET_ADDRESSES:0x70a0af9d47a0f6314c4eef2a68666b096701ebdf}

# The Graph 配置（已弃用 - Hosted Service 已关闭，Studio 不支持 Mantle）
# 现在使用后端自建的事件索引器（EventIndexerService）
thegraph:
  enabled: false  # 已禁用，使用 EventIndexerService 替代
  endpoint: ""
  timeout-seconds: 10

# 事件索引器配置（后端自建）
event-indexer:
  enabled: true  # 是否启用事件索引器（自动监听链上事件）
  sync-interval-seconds: 30  # 同步间隔（秒）


